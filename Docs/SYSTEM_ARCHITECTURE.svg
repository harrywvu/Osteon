    <symbol id="file" viewBox="0 0 64 64"><path d="M15 5h25l10 10v44H15zM40 5v12h10M23 29h19M23 39h19M23 49h13" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></symbol>
