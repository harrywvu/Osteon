    <symbol id="headset" viewBox="0 0 64 64"><path d="M7 27Q7 11 32 11T57 27v18q-4 7-12 7l-6-8H25l-6 8Q11 52 7 45zM9 30h46" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></symbol>
