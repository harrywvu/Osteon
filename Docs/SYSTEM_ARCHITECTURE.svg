    <symbol id="http" viewBox="0 0 64 64"><path d="M10 20h44M10 32h44M10 44h44M18 11v42m28-42v42" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="3"/></symbol>
