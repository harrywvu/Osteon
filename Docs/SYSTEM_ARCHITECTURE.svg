<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">Osteon high-level system architecture</title>
  <desc id="desc">Quest and WebGL clients use one Unity anatomy scene. The scene contains platform input, anatomy navigation, panels, local settings and speech, and HTTP account and quiz clients. Separate AWS account and quiz APIs use Lambda and DynamoDB. The quiz Lambda uses packaged questions and an ONNX model, a Secrets Manager key, and optional Gemini feedback. Build assets and outputs are shown separately.</desc>
